name: Fetch official Node runtime for Forge

on:
  push:
    branches:
      - forge-temp-installer-v026

permissions:
  contents: write

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download official Windows Node runtime package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-runtime
          cd node-runtime
          npm pack node-win-x64@22.22.2
          tar -xzf node-win-x64-22.22.2.tgz
          node_path=$(find package -type f -iname node.exe -print -quit)
          test -n "$node_path"
          cp "$node_path" node.exe
          sha256sum node.exe > SHA256SUMS.txt
      - name: Publish temporary runtime asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="forge-node-runtime-v22.22.2"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" node-runtime/node.exe node-runtime/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "Temporary official Node runtime for Forge" \
            --notes "Official node-win-x64 22.22.2 runtime used to build the Forge portable executable." \
            --prerelease
