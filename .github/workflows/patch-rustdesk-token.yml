name: Authenticate RustDesk download

on:
  push:
    branches: [feat/secure-ai-support-agent]
    paths:
      - '.github/workflows/patch-rustdesk-token.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-ai-support-agent
      - name: Pass GitHub token to dependency preparation
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['.github/workflows/validate-windows.yml', '.github/workflows/publish-release.yml']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = "      - name: Prepare verified RustDesk client\n        shell: pwsh\n        run: ./scripts/prepare-rustdesk.ps1"
              new = "      - name: Prepare verified RustDesk client\n        shell: pwsh\n        env:\n          GITHUB_TOKEN: ${{ github.token }}\n        run: ./scripts/prepare-rustdesk.ps1"
              if old not in text:
                  raise SystemExit(f'RustDesk step not found in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-rustdesk-token.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate-windows.yml .github/workflows/publish-release.yml .github/workflows/patch-rustdesk-token.yml
          git commit -m "ci: authenticate RustDesk release metadata"
          git push origin HEAD:feat/secure-ai-support-agent
