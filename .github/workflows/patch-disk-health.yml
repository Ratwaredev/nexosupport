name: Add disk health tool

on:
  push:
    branches: [feat/secure-ai-support-agent]
    paths:
      - '.github/workflows/patch-disk-health.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-ai-support-agent
      - name: Add read-only disk health tool
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing patch anchor in {path}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              file.write_text(text, encoding='utf-8')

          patch('src/lib/assistant.ts', [
              ("  | 'run_quick_diagnostic'\n  | 'network_check'", "  | 'run_quick_diagnostic'\n  | 'disk_health'\n  | 'network_check'"),
              ("  run_quick_diagnostic: { id: 'run_quick_diagnostic', label: 'Revisar esta PC', shortLabel: 'Revisión general', description: 'Lee RAM, disco, reinicio pendiente, seguridad e inicio. No modifica nada.', mode: 'read', progressLabel: 'Revisando PC' },\n", "  run_quick_diagnostic: { id: 'run_quick_diagnostic', label: 'Revisar esta PC', shortLabel: 'Revisión general', description: 'Lee RAM, disco, reinicio pendiente, seguridad e inicio. No modifica nada.', mode: 'read', progressLabel: 'Revisando PC' },\n  disk_health: { id: 'disk_health', label: 'Revisar salud del disco', shortLabel: 'Salud del disco', description: 'Lee estado, medio, temperatura, desgaste y errores expuestos por Windows. No modifica nada.', mode: 'read', progressLabel: 'Revisando disco' },\n")
          ])

          patch('supabase/functions/nexo-assistant/index.ts', [
              ("  | 'run_quick_diagnostic'\n  | 'network_check'", "  | 'run_quick_diagnostic'\n  | 'disk_health'\n  | 'network_check'"),
              ("  'run_quick_diagnostic',\n  'network_check',", "  'run_quick_diagnostic',\n  'disk_health',\n  'network_check',"),
              ("  tool('run_quick_diagnostic', 'Lee RAM, disco, reinicio pendiente, seguridad e inicio. No modifica nada.'),\n", "  tool('run_quick_diagnostic', 'Lee RAM, espacio, reinicio pendiente, seguridad e inicio. No modifica nada.'),\n  tool('disk_health', 'Lee estado, medio, temperatura, desgaste, errores y predicción de falla expuestos por Windows. No modifica nada.'),\n"),
              ("- Ante un problema amplio o rendimiento lento, empezá con run_quick_diagnostic.\n- Usá la evidencia", "- Ante un problema amplio o rendimiento lento, empezá con run_quick_diagnostic.\n- Si el problema menciona disco lento, disco al 100%, ruidos o bloqueos, pedí disk_health después del diagnóstico general.\n- Usá la evidencia")
          ])

          patch('src-tauri/src/app/actions.rs', [
              ('        "temp_scan" => scan_temp_files(),\n        "startup_review"', '        "temp_scan" => scan_temp_files(),\n        "disk_health" => disk_health(),\n        "startup_review"'),
              ('fn startup_review() -> Result<AgentActionResult, String> {', r'''fn disk_health() -> Result<AgentActionResult, String> {
    #[cfg(target_os = "windows")]
    {
        let raw = super::diagnostics::run_powershell(
            r#"$disks=@();
try {
  $disks=@(Get-PhysicalDisk -ErrorAction Stop | ForEach-Object {
    $disk=$_;$r=$null;
    try{$r=$disk | Get-StorageReliabilityCounter -ErrorAction Stop}catch{}
    [PSCustomObject]@{
      friendlyName=$disk.FriendlyName;
      mediaType=[string]$disk.MediaType;
      busType=[string]$disk.BusType;
      healthStatus=[string]$disk.HealthStatus;
      operationalStatus=@($disk.OperationalStatus | ForEach-Object {[string]$_});
      sizeGb=[Math]::Round($disk.Size/1GB,1);
      temperature=if($r){$r.Temperature}else{$null};
      wear=if($r){$r.Wear}else{$null};
      readErrorsTotal=if($r){$r.ReadErrorsTotal}else{$null};
      writeErrorsTotal=if($r){$r.WriteErrorsTotal}else{$null};
      powerOnHours=if($r){$r.PowerOnHours}else{$null}
    }
  })
}catch{}
$predicted=$false;
try{$predicted=[bool](@(Get-CimInstance -Namespace root/wmi -ClassName MSStorageDriver_FailurePredictStatus -ErrorAction Stop | Where-Object PredictFailure).Count -gt 0)}catch{}
[PSCustomObject]@{disks=$disks;failurePredicted=$predicted;source='Windows Storage Management'} | ConvertTo-Json -Compress -Depth 6"#,
        )?;
        Ok(ok(
            "disk_health",
            "Terminé de revisar la salud que Windows expone para los discos.",
            vec![raw],
        ))
    }
    #[cfg(not(target_os = "windows"))]
    {
        Ok(ok(
            "disk_health",
            "Esta revisión está disponible en Windows.",
            vec![],
        ))
    }
}

fn startup_review() -> Result<AgentActionResult, String> {''')
          ])

          patch('src/lib/agent.ts', [
              ("  if (actionId === 'network_check') return", "  if (actionId === 'disk_health') return { disks: [{ friendlyName: 'NVMe de prueba', mediaType: 'SSD', busType: 'NVMe', healthStatus: 'Healthy', operationalStatus: ['OK'], sizeGb: 476.9, temperature: 42, wear: 2, readErrorsTotal: 0, writeErrorsTotal: 0, powerOnHours: 1820 }], failurePredicted: false, source: 'Windows Storage Management' };\n  if (actionId === 'network_check') return")
          ])

          patch('scripts/smoke-ui.mjs', [
              ("    } else if (!toolNames.includes('scan_temp_files')) {", "    } else if (!toolNames.includes('disk_health')) {\n      message = { role: 'assistant', content: null, tool_calls: [{ id: 'call-disk-health', type: 'function', function: { name: 'disk_health', arguments: '{}' } }] };\n    } else if (!toolNames.includes('scan_temp_files')) {")
          ])

          patch('scripts/verify-product-contracts.mjs', [
              ("requireMatch(edgeFunction, /parallel_tool_calls", "requireMatch(assistant, /disk_health/, 'El catálogo debe incluir salud de disco.');\nrequireMatch(edgeFunction, /disk_health/, 'El agente remoto debe poder pedir salud de disco.');\nrequireMatch(app.replace ? app : app, /run_agent_action/, 'El backend debe exponer acciones cerradas.');\nrequireMatch(edgeFunction, /parallel_tool_calls"),
              ("requireMatch(diagnostics, /CREATE_NO_WINDOW/", "requireMatch(agent, /disk_health/, 'La vista previa debe cubrir salud de disco.');\nrequireMatch(await readFile('src-tauri/src/app/actions.rs', 'utf8'), /Get-StorageReliabilityCounter[\\s\\S]*MSStorageDriver_FailurePredictStatus/, 'La salud de disco debe usar fuentes de Windows de solo lectura.');\nrequireMatch(diagnostics, /CREATE_NO_WINDOW/")
          ])

          patch('README.md', [
              ("- diagnóstico general;\n- sensores", "- diagnóstico general;\n- salud, errores y desgaste del disco;\n- sensores")
          ])
          PY
          rm .github/workflows/patch-disk-health.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/assistant.ts supabase/functions/nexo-assistant/index.ts src-tauri/src/app/actions.rs src/lib/agent.ts scripts/smoke-ui.mjs scripts/verify-product-contracts.mjs README.md .github/workflows/patch-disk-health.yml
          git commit -m "feat: diagnose disk health before optimizing"
          git push origin HEAD:feat/secure-ai-support-agent
