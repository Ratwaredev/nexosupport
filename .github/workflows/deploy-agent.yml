name: Deploy NEXO agent

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/nexo-assistant/**'
      - 'supabase/config.toml'
      - 'infra/supabase/nexo-assistant.sql'
      - 'infra/supabase/secure-agent.sql'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-agent-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NEXO_SUPABASE_PAT || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEXO_DEFAULT_MODEL: ${{ secrets.NEXO_DEFAULT_MODEL }}
      NEXO_MODEL_BASIC: ${{ secrets.NEXO_MODEL_BASIC }}
      NEXO_MODEL_PRO: ${{ secrets.NEXO_MODEL_PRO }}
      NEXO_MODEL_MAX: ${{ secrets.NEXO_MODEL_MAX }}
      NEXO_APP_URL: ${{ secrets.NEXO_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project and verify deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing NEXO_SUPABASE_PAT or SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'Missing OPENROUTER_API_KEY'; exit 1; }

          project_ref="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$project_ref" ]; then
            test -n "${VITE_SUPABASE_URL:-}" || { echo 'Missing VITE_SUPABASE_URL'; exit 1; }
            project_ref="$(python - <<'PY'
          import os
          from urllib.parse import urlparse
          host = urlparse(os.environ['VITE_SUPABASE_URL']).hostname or ''
          suffix = '.supabase.co'
          if not host.endswith(suffix):
              raise SystemExit('Invalid VITE_SUPABASE_URL')
          print(host[:-len(suffix)])
          PY
          )"
          fi
          test -n "$project_ref" || { echo 'Could not resolve Supabase project ref'; exit 1; }
          echo "SUPABASE_PROJECT_REF=$project_ref" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Apply additive product and security migrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/nexo-sql.json"
          import json
          from pathlib import Path
          paths = [
              Path('infra/supabase/nexo-assistant.sql'),
              Path('infra/supabase/secure-agent.sql'),
          ]
          query = '\n\n'.join(path.read_text(encoding='utf-8') for path in paths)
          print(json.dumps({'query': query, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/nexo-sql.json"
          rm -f "$RUNNER_TEMP/nexo-sql.json"

      - name: Configure server secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'NEXO_DEFAULT_MODEL=%s\n' "${NEXO_DEFAULT_MODEL:-openrouter/auto}"
            printf 'NEXO_MODEL_BASIC=%s\n' "${NEXO_MODEL_BASIC:-openrouter/auto}"
            printf 'NEXO_MODEL_PRO=%s\n' "${NEXO_MODEL_PRO:-openrouter/auto}"
            printf 'NEXO_MODEL_MAX=%s\n' "${NEXO_MODEL_MAX:-openrouter/auto}"
            printf 'NEXO_APP_URL=%s\n' "${NEXO_APP_URL:-https://nexo.local}"
          } > "$RUNNER_TEMP/nexo-agent.env"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$RUNNER_TEMP/nexo-agent.env"
          rm -f "$RUNNER_TEMP/nexo-agent.env"

      - name: Deploy function
        run: supabase functions deploy nexo-assistant --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
