name: Patch legacy disk map

on:
  push:
    branches: [feat/secure-ai-support-agent]
    paths:
      - '.github/workflows/patch-legacy-disk-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-ai-support-agent
      - name: Patch compiled legacy maps
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['src/AssistantApp.tsx', 'src/SupportAppV2.tsx']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = "if (tool === 'remote_support') return remoteSupport(); const actionMap: Record<Exclude<AssistantToolId, 'run_quick_diagnostic' | 'remote_support'>, string> = {"
              new = "if (tool === 'remote_support') return remoteSupport(); if (tool === 'disk_health') { const disk = await runAgentAction('disk_health'); addAssistant(disk.message, undefined, disk); return disk; } const actionMap: Record<Exclude<AssistantToolId, 'run_quick_diagnostic' | 'remote_support' | 'disk_health'>, string> = {"
              if old not in text:
                  raise SystemExit(f'Legacy action map not found in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-legacy-disk-map.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/AssistantApp.tsx src/SupportAppV2.tsx .github/workflows/patch-legacy-disk-map.yml
          git commit -m "fix: compile legacy surfaces with disk health"
          git push origin HEAD:feat/secure-ai-support-agent
