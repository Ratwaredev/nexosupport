name: Align agent smoke

on:
  push:
    branches: [feat/secure-ai-support-agent]
    paths:
      - '.github/workflows/patch-agent-smoke.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-ai-support-agent
      - name: Patch smoke state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/smoke-ui.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  await waitText(page, 'Sin datos');\n", '')
          text = text.replace("  if (await page.locator('.nv-rocket').count()) throw new Error('Rocket rendered before optimization.');\n", '')
          if "await page.getByRole('button', { name: 'Analizar', exact: true }).click();" not in text:
              raise SystemExit('Manual optimizer flow missing')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-agent-smoke.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/smoke-ui.mjs .github/workflows/patch-agent-smoke.yml
          git commit -m "test: reuse optimizer evidence after agent run"
          git push origin HEAD:feat/secure-ai-support-agent
