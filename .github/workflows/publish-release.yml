name: Publish NEXO Support release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nexo-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set unique release version
        shell: pwsh
        run: |
          $version = "0.3.${{ github.run_number }}"
          node scripts/set-release-version.mjs $version
          "NEXO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Prepare hardware sensor library
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1

      - name: Validate frontend
        run: npm run build

      - name: Validate Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Build and publish GitHub Release
        id: publish_release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NEXO_API_URL: ${{ secrets.VITE_NEXO_API_URL }}
          VITE_DEFAULT_ORG_NAME: ${{ secrets.VITE_DEFAULT_ORG_NAME }}
          VITE_REMOTE_TOOL_URL: ${{ secrets.VITE_REMOTE_TOOL_URL }}
          VITE_LOCAL_ADMIN_EMAIL: ${{ secrets.VITE_LOCAL_ADMIN_EMAIL }}
          VITE_LOCAL_ADMIN_PASSWORD: ${{ secrets.VITE_LOCAL_ADMIN_PASSWORD }}
          VITE_LOCAL_ADMIN_ORG: ${{ secrets.VITE_LOCAL_ADMIN_ORG }}
        with:
          tagName: v__VERSION__
          releaseName: NEXO Support v__VERSION__
          releaseBody: |
            Actualización automática desde main.

            - Interfaz inicial simplificada.
            - Inicio inmediato del diagnóstico.
            - Mejoras generales de NEXO Support.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

      - name: Verify published updater feed
        id: verify_updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:NEXO_VERSION/latest.json"
          $probe = [ordered]@{
            ok = $false
            manifestUrl = $manifestUrl
            expectedVersion = $env:NEXO_VERSION
            version = $null
            platform = $null
            assetUrl = $null
            signatureLength = 0
            assetBytes = 0
            error = $null
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            manifest = $null
          }
          try {
            $manifest = $null
            for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $manifestUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 30
                if ($response.StatusCode -eq 200) {
                  $raw = if ($response.Content -is [byte[]]) {
                    [System.Text.Encoding]::UTF8.GetString($response.Content)
                  } else {
                    [string]$response.Content
                  }
                  $manifest = $raw | ConvertFrom-Json
                  break
                }
              } catch {
                if ($attempt -eq 18) { throw }
              }
              Start-Sleep -Seconds 5
            }
            if ($null -eq $manifest) { throw 'latest.json was not published.' }
            $probe.version = $manifest.version
            $probe.manifest = $manifest
            if ($manifest.version -ne $env:NEXO_VERSION) {
              throw "latest.json version $($manifest.version) does not match $env:NEXO_VERSION."
            }
            $windows = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -match '^windows-x86_64' })
            if ($windows.Count -eq 0) { throw 'latest.json has no Windows x86_64 updater entry.' }
            $entry = $windows | Where-Object { $_.Name -match 'nsis' } | Select-Object -First 1
            if ($null -eq $entry) { $entry = $windows[0] }
            $probe.platform = $entry.Name
            $probe.assetUrl = $entry.Value.url
            $probe.signatureLength = if ($entry.Value.signature) { $entry.Value.signature.Length } else { 0 }
            if ([string]::IsNullOrWhiteSpace($entry.Value.url)) { throw 'Windows updater URL is empty.' }
            if ([string]::IsNullOrWhiteSpace($entry.Value.signature)) { throw 'Windows updater signature is empty.' }
            $assetPath = Join-Path $env:RUNNER_TEMP 'nexo-updater-asset.bin'
            Invoke-WebRequest -Uri $entry.Value.url -OutFile $assetPath -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 120
            $probe.assetBytes = (Get-Item $assetPath).Length
            if ($probe.assetBytes -lt 100000) { throw "Windows updater asset is unexpectedly small: $($probe.assetBytes) bytes." }
            $probe.ok = $true
            "UPDATER_PLATFORM=$($entry.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } catch {
            $probe.error = $_.Exception.ToString()
          } finally {
            $probe.checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            $probe | ConvertTo-Json -Depth 12 | Set-Content -Path updater-probe.json -Encoding utf8
          }
          if (-not $probe.ok) { throw $probe.error }

      - name: Record production release status
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_STATUS: ${{ job.status }}
          RELEASE_VERSION: ${{ env.NEXO_VERSION }}
          RELEASE_URL: ${{ steps.publish_release.outputs.releaseHtmlUrl }}
          UPDATER_PLATFORM: ${{ env.UPDATER_PLATFORM }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.release-result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let updaterProbe = null;
            if (fs.existsSync('updater-probe.json')) {
              updaterProbe = JSON.parse(fs.readFileSync('updater-probe.json', 'utf8').replace(/^\uFEFF/, ''));
            }
            const payload = {
              version: process.env.RELEASE_VERSION || null,
              status: process.env.RELEASE_STATUS,
              runId: String(context.runId),
              commit: context.sha,
              releaseUrl: process.env.RELEASE_URL || null,
              updaterPlatform: process.env.UPDATER_PLATFORM || null,
              updaterProbe,
              recordedAt: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: `release: ${payload.version || 'unknown'} ${payload.status}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
