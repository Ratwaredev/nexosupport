name: Publish NEXO Support release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nexo-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set unique release version
        shell: pwsh
        run: |
          $version = "0.4.${{ github.run_number }}"
          node scripts/set-release-version.mjs $version
          "NEXO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Build native sensor reader
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1

      - name: Verify native sensor reader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'src-tauri\resources\sensor-helper'
          $reader = Join-Path $root 'Nexo.SensorReader.exe'
          if (-not (Test-Path $reader)) { throw 'Missing Nexo.SensorReader.exe before release.' }
          if (-not (Test-Path (Join-Path $root 'LibreHardwareMonitorLib.dll'))) { throw 'Missing LibreHardwareMonitorLib.dll before release.' }
          $probePath = Join-Path $env:RUNNER_TEMP 'sensor-release-probe.json'
          $process = Start-Process -FilePath $reader -ArgumentList @('--output', $probePath) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Sensor reader exited with code $($process.ExitCode)." }
          $probe = Get-Content $probePath -Raw | ConvertFrom-Json
          if ($probe.source -ne 'native-helper') { throw "Unexpected sensor source: $($probe.source)" }
          $invalidTemperatures = @($probe.sensors | Where-Object { $_.sensorType -eq 'Temperature' -and ($_.value -lt 5 -or $_.value -gt 125) })
          if ($invalidTemperatures.Count -gt 0) { throw 'Sensor reader returned an impossible temperature.' }

      - name: Validate frontend
        run: npm run build

      - name: Verify product contracts
        run: node scripts/verify-product-contracts.mjs

      - name: Install browser for release smoke
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Validate production UI before publishing
        shell: pwsh
        run: |
          $preview = Start-Process npm.cmd -ArgumentList @('run','preview','--','--host','127.0.0.1','--port','4173') -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start.' }
            node scripts/smoke-ui.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-ui-evidence
          path: artifacts/ui/*.png
          if-no-files-found: warn

      - name: Validate Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Build and publish GitHub Release
        id: publish_release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_DEFAULT_ORG_NAME: ${{ secrets.VITE_DEFAULT_ORG_NAME }}
          VITE_REMOTE_TOOL_URL: ${{ secrets.VITE_REMOTE_TOOL_URL }}
          VITE_LOCAL_ADMIN_EMAIL: ${{ secrets.VITE_LOCAL_ADMIN_EMAIL }}
          VITE_LOCAL_ADMIN_PASSWORD: ${{ secrets.VITE_LOCAL_ADMIN_PASSWORD }}
          VITE_LOCAL_ADMIN_ORG: ${{ secrets.VITE_LOCAL_ADMIN_ORG }}
        with:
          tagName: v__VERSION__
          releaseName: NEXO Support v__VERSION__
          releaseBody: |
            Actualización profesional de NEXO Support.

            - Interfaz compacta, alineada y con feedback visible por acción.
            - Diagnósticos y mantenimiento ejecutados fuera del hilo de interfaz.
            - PowerShell y herramientas nativas sin ventanas de consola.
            - Temperaturas imposibles descartadas y lecturas ACPI marcadas como aproximadas.
            - NEXO Control abre de forma confiable.
            - Detección y apertura de RustDesk instalado para escritorio remoto autorizado.
            - Release bloqueado automáticamente si falla el build, los contratos o las pruebas visuales.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

      - name: Verify published updater feed
        id: verify_updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:NEXO_VERSION/latest.json"
          $probe = [ordered]@{
            ok = $false
            manifestUrl = $manifestUrl
            expectedVersion = $env:NEXO_VERSION
            version = $null
            platform = $null
            assetUrl = $null
            signatureLength = 0
            assetBytes = 0
            error = $null
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            manifest = $null
          }
          try {
            $manifest = $null
            for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $manifestUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 30
                if ($response.StatusCode -eq 200) {
                  $raw = if ($response.Content -is [byte[]]) {
                    [System.Text.Encoding]::UTF8.GetString($response.Content)
                  } else {
                    [string]$response.Content
                  }
                  $manifest = $raw | ConvertFrom-Json
                  break
                }
              } catch {
                if ($attempt -eq 18) { throw }
              }
              Start-Sleep -Seconds 5
            }
            if ($null -eq $manifest) { throw 'latest.json was not published.' }
            $probe.version = $manifest.version
            $probe.manifest = $manifest
            if ($manifest.version -ne $env:NEXO_VERSION) {
              throw "latest.json version $($manifest.version) does not match $env:NEXO_VERSION."
            }
            $windows = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -match '^windows-x86_64' })
            if ($windows.Count -eq 0) { throw 'latest.json has no Windows x86_64 updater entry.' }
            $entry = $windows | Where-Object { $_.Name -match 'nsis' } | Select-Object -First 1
            if ($null -eq $entry) { $entry = $windows[0] }
            $probe.platform = $entry.Name
            $probe.assetUrl = $entry.Value.url
            $probe.signatureLength = if ($entry.Value.signature) { $entry.Value.signature.Length } else { 0 }
            if ([string]::IsNullOrWhiteSpace($entry.Value.url)) { throw 'Windows updater URL is empty.' }
            if ([string]::IsNullOrWhiteSpace($entry.Value.signature)) { throw 'Windows updater signature is empty.' }
            $assetPath = Join-Path $env:RUNNER_TEMP 'nexo-updater-asset.bin'
            Invoke-WebRequest -Uri $entry.Value.url -OutFile $assetPath -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 120
            $probe.assetBytes = (Get-Item $assetPath).Length
            if ($probe.assetBytes -lt 100000) { throw "Windows updater asset is unexpectedly small: $($probe.assetBytes) bytes." }
            $probe.ok = $true
            "UPDATER_PLATFORM=$($entry.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } catch {
            $probe.error = $_.Exception.ToString()
          } finally {
            $probe.checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            $probe | ConvertTo-Json -Depth 12 | Set-Content -Path updater-probe.json -Encoding utf8
          }
          if (-not $probe.ok) { throw $probe.error }

      - name: Record production release status
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_STATUS: ${{ job.status }}
          RELEASE_VERSION: ${{ env.NEXO_VERSION }}
          RELEASE_URL: ${{ steps.publish_release.outputs.releaseHtmlUrl }}
          UPDATER_PLATFORM: ${{ env.UPDATER_PLATFORM }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.release-result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let updaterProbe = null;
            if (fs.existsSync('updater-probe.json')) {
              updaterProbe = JSON.parse(fs.readFileSync('updater-probe.json', 'utf8').replace(/^\uFEFF/, ''));
            }
            const payload = {
              version: process.env.RELEASE_VERSION || null,
              status: process.env.RELEASE_STATUS,
              runId: String(context.runId),
              commit: context.sha,
              releaseUrl: process.env.RELEASE_URL || null,
              updaterPlatform: process.env.UPDATER_PLATFORM || null,
              updaterProbe,
              runtimeMode: 'local',
              recordedAt: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: `release: ${payload.version || 'unknown'} ${payload.status}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
