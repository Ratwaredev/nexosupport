name: Publish NEXO Support release

on:
  workflow_dispatch:
  push:
    branches: [main, agent/nexo-support-rebrand]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Prepare hardware sensor library
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing repository secret TAURI_SIGNING_PRIVATE_KEY. The updater cannot publish unsigned releases.'
          }

      - name: Build and publish GitHub Release
        id: publish_release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NEXO_API_URL: ${{ secrets.VITE_NEXO_API_URL }}
          VITE_DEFAULT_ORG_NAME: ${{ secrets.VITE_DEFAULT_ORG_NAME }}
          VITE_REMOTE_TOOL_URL: ${{ secrets.VITE_REMOTE_TOOL_URL }}
          VITE_LOCAL_ADMIN_EMAIL: ${{ secrets.VITE_LOCAL_ADMIN_EMAIL }}
          VITE_LOCAL_ADMIN_PASSWORD: ${{ secrets.VITE_LOCAL_ADMIN_PASSWORD }}
          VITE_LOCAL_ADMIN_ORG: ${{ secrets.VITE_LOCAL_ADMIN_ORG }}
        with:
          tagName: v__VERSION__
          releaseName: NEXO Support v__VERSION__
          releaseBody: |
            Actualización de NEXO Support.

            - Corrige el primer inicio del popup.
            - Separa los estilos del asistente y NEXO Control.
            - Agrega actualizaciones desde la propia aplicación.
            - Mantiene diagnósticos, sensores y permisos del usuario.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

      - name: Record release result
        if: always()
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.publish_release.outputs.releaseHtmlUrl }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $result = [ordered]@{
            version = $version
            status = '${{ job.status }}'
            runId = '${{ github.run_id }}'
            commit = '${{ github.sha }}'
            releaseUrl = $env:RELEASE_URL
            recordedAt = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          Set-Content -Path .release-result.json -Value $result -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-result.json
          git commit -m "chore: record NEXO release $version ${{ job.status }}" || exit 0
          git push origin "HEAD:${{ github.ref_name }}"
