name: Publish NEXO Support release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger'

concurrency:
  group: nexo-production-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_DEFAULT_PAIRING_CODE: ${{ secrets.VITE_DEFAULT_PAIRING_CODE }}
  VITE_DEFAULT_ORG_NAME: ${{ secrets.VITE_DEFAULT_ORG_NAME }}
  VITE_REMOTE_TOOL_URL: ${{ secrets.VITE_REMOTE_TOOL_URL }}
  VITE_LOCAL_ADMIN_EMAIL: ${{ secrets.VITE_LOCAL_ADMIN_EMAIL }}
  VITE_LOCAL_ADMIN_PASSWORD: ${{ secrets.VITE_LOCAL_ADMIN_PASSWORD }}
  VITE_LOCAL_ADMIN_ORG: ${{ secrets.VITE_LOCAL_ADMIN_ORG }}

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set unique release version
        shell: pwsh
        run: |
          $version = "0.4.${{ github.run_number }}"
          node scripts/set-release-version.mjs $version
          "NEXO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $connected = -not [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -and -not [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)
          "NEXO_RUNTIME_MODE=$(if ($connected) { 'connected' } else { 'local' })" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci

      - name: Build native sensor reader
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1

      - name: Prepare verified RustDesk client
        shell: pwsh
        run: ./scripts/prepare-rustdesk.ps1

      - name: Verify native resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sensorRoot = Join-Path $PWD 'src-tauri\resources\sensor-helper'
          $reader = Join-Path $sensorRoot 'Nexo.SensorReader.exe'
          $rustdesk = Join-Path $PWD 'src-tauri\resources\rustdesk\rustdesk-installer.exe'
          if (-not (Test-Path $reader)) { throw 'Missing Nexo.SensorReader.exe before release.' }
          if (-not (Test-Path (Join-Path $sensorRoot 'LibreHardwareMonitorLib.dll'))) { throw 'Missing LibreHardwareMonitorLib.dll before release.' }
          if (-not (Test-Path $rustdesk) -or (Get-Item $rustdesk).Length -lt 5MB) { throw 'RustDesk installer is missing or incomplete.' }
          $probePath = Join-Path $env:RUNNER_TEMP 'sensor-release-probe.json'
          $process = Start-Process -FilePath $reader -ArgumentList @('--output', $probePath) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Sensor reader exited with code $($process.ExitCode)." }
          $probe = Get-Content $probePath -Raw | ConvertFrom-Json
          if ($probe.source -ne 'native-helper') { throw "Unexpected sensor source: $($probe.source)" }
          $invalidTemperatures = @($probe.sensors | Where-Object { $_.sensorType -eq 'Temperature' -and ($_.value -lt 5 -or $_.value -gt 125) })
          if ($invalidTemperatures.Count -gt 0) { throw 'Sensor reader returned an impossible temperature.' }

      - name: Validate frontend
        run: npm run build

      - name: Verify product contracts
        run: node scripts/verify-product-contracts.mjs

      - name: Install browser for release smoke
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Validate production UI before publishing
        shell: pwsh
        run: |
          $preview = Start-Process npm.cmd -ArgumentList @('run','preview','--','--host','127.0.0.1','--port','4173') -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start.' }
            node scripts/smoke-ui.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-ui-evidence
          path: artifacts/ui/*.png
          if-no-files-found: warn

      - name: Validate Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY.' }

      - name: Build and publish GitHub Release
        id: publish_release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: NEXO Support v__VERSION__
          releaseBody: |
            Actualización estable de NEXO Support.

            - Inicio de sesión por email y código.
            - Actualizaciones remotas firmadas y automáticas.
            - Administración y soporte remoto conservan sus validaciones de producción.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 2

      - name: Publish shared desktop auth config
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw 'Missing Supabase client configuration.'
          }
          $auth = [ordered]@{
            provider = 'supabase'
            version = 1
            supabaseUrl = $env:VITE_SUPABASE_URL
            supabaseAnonKey = $env:VITE_SUPABASE_ANON_KEY
            otpType = 'email'
          }
          $auth | ConvertTo-Json -Depth 4 | Set-Content -Path auth-config.json -Encoding utf8
          gh release upload "v$env:NEXO_VERSION" auth-config.json --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish auth-config.json.' }

      - name: Verify shared auth config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$env:NEXO_VERSION/auth-config.json"
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 30
          $raw = if ($response.Content -is [byte[]]) { [System.Text.Encoding]::UTF8.GetString($response.Content) } else { [string]$response.Content }
          $config = $raw | ConvertFrom-Json
          if ($config.provider -ne 'supabase') { throw 'Unexpected auth provider.' }
          if ([string]::IsNullOrWhiteSpace($config.supabaseUrl)) { throw 'Published auth config has no URL.' }
          if ([string]::IsNullOrWhiteSpace($config.supabaseAnonKey)) { throw 'Published auth config has no anon key.' }
          if ($config.otpType -ne 'email') { throw 'Published auth config is not email OTP.' }

      - name: Verify published updater feed
        id: verify_updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:NEXO_VERSION/latest.json"
          $probe = [ordered]@{
            ok = $false
            manifestUrl = $manifestUrl
            expectedVersion = $env:NEXO_VERSION
            version = $null
            platform = $null
            assetUrl = $null
            signatureLength = 0
            assetBytes = 0
            error = $null
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            manifest = $null
          }
          try {
            $manifest = $null
            for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $manifestUrl -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 30
                if ($response.StatusCode -eq 200) {
                  $raw = if ($response.Content -is [byte[]]) { [System.Text.Encoding]::UTF8.GetString($response.Content) } else { [string]$response.Content }
                  $manifest = $raw | ConvertFrom-Json
                  break
                }
              } catch { if ($attempt -eq 18) { throw } }
              Start-Sleep -Seconds 5
            }
            if ($null -eq $manifest) { throw 'latest.json was not published.' }
            $probe.version = $manifest.version
            $probe.manifest = $manifest
            if ($manifest.version -ne $env:NEXO_VERSION) { throw "latest.json version $($manifest.version) does not match $env:NEXO_VERSION." }
            $windows = @($manifest.platforms.PSObject.Properties | Where-Object { $_.Name -match '^windows-x86_64' })
            if ($windows.Count -eq 0) { throw 'latest.json has no Windows x86_64 updater entry.' }
            $entry = $windows | Where-Object { $_.Name -match 'nsis' } | Select-Object -First 1
            if ($null -eq $entry) { $entry = $windows[0] }
            $probe.platform = $entry.Name
            $probe.assetUrl = $entry.Value.url
            $probe.signatureLength = if ($entry.Value.signature) { $entry.Value.signature.Length } else { 0 }
            if ([string]::IsNullOrWhiteSpace($entry.Value.url)) { throw 'Windows updater URL is empty.' }
            if ([string]::IsNullOrWhiteSpace($entry.Value.signature)) { throw 'Windows updater signature is empty.' }
            $assetPath = Join-Path $env:RUNNER_TEMP 'nexo-updater-asset.bin'
            Invoke-WebRequest -Uri $entry.Value.url -OutFile $assetPath -UseBasicParsing -MaximumRedirection 10 -TimeoutSec 180
            $probe.assetBytes = (Get-Item $assetPath).Length
            if ($probe.assetBytes -lt 5000000) { throw "Windows updater asset is unexpectedly small: $($probe.assetBytes) bytes." }
            $probe.ok = $true
            "UPDATER_PLATFORM=$($entry.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } catch {
            $probe.error = $_.Exception.ToString()
          } finally {
            $probe.checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            $probe | ConvertTo-Json -Depth 12 | Set-Content -Path updater-probe.json -Encoding utf8
          }
          if (-not $probe.ok) { throw $probe.error }

      - name: Record release result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.release-result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let updaterProbe = null;
            try { updaterProbe = JSON.parse(fs.readFileSync('updater-probe.json', 'utf8').replace(/^\uFEFF/, '')); } catch {}
            const payload = {
              version: process.env.NEXO_VERSION || null,
              status: process.env.RELEASE_STATUS,
              runId: String(context.runId),
              commit: context.sha,
              releaseUrl: process.env.NEXO_VERSION ? `https://github.com/${owner}/${repo}/releases/tag/v${process.env.NEXO_VERSION}` : null,
              updaterPlatform: process.env.UPDATER_PLATFORM || null,
              updaterProbe,
              runtimeMode: process.env.NEXO_RUNTIME_MODE || null,
              recordedAt: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: `release: ${payload.status} ${payload.version || ''}`.trim(),
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
