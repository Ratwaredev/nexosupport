name: Apply real updater and admin recovery

on:
  push:
    branches: [fix/real-updater-admin-recovery]
    paths:
      - '.github/scripts/apply-real-updater-admin-recovery.py'
      - '.github/workflows/apply-real-updater-admin-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-real-updater-admin-recovery
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-updater-admin-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply definitive patch
        run: python .github/scripts/apply-real-updater-admin-recovery.py

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run build

      - name: Verify product contracts
        run: node scripts/verify-product-contracts.mjs

      - name: Validate native updater
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Remove temporary patch files
        shell: bash
        run: |
          rm -f .github/scripts/apply-real-updater-admin-recovery.py
          rm -f .github/workflows/apply-real-updater-admin-recovery.yml

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix active installation and restore NEXO administration"
          git push origin HEAD:fix/real-updater-admin-recovery
