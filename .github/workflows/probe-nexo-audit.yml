name: Probe NEXO recovery audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-nexo-audit.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read recovery audit
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 60 \
            'https://byuktfnrwgtjkpjkovai.supabase.co/functions/v1/nexo-recovery-audit' \
            -o "$RUNNER_TEMP/audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['RUNNER_TEMP'],'audit.json').read_text())
          env=value.get('env') or {}
          print('RUNTIME_DB_URL=' + str(bool(env.get('dbUrl'))).lower())
          print('RUNTIME_SUPABASE_URL=' + str(bool(env.get('supabaseUrl'))).lower())
          print('RUNTIME_SERVICE_ROLE=' + str(bool(env.get('serviceRole'))).lower())
          print('RUNTIME_OPENROUTER=' + str(bool(env.get('openrouter'))).lower())
          for table, info in (value.get('counts') or {}).items():
              if isinstance(info, dict):
                  print(f"TABLE {table} exists={info.get('exists')} count={info.get('count')}")
              else:
                  print(f"TABLE {table} value={info}")
          auth=value.get('authUsers')
          print(f"AUTH_USERS total={auth}")
          if value.get('dbError'):
              print('DB_ERROR=' + str(value.get('dbError')))
          PY
