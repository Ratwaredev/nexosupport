name: Diagnose NEXO backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-nexo-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NEXO_SUPABASE_PAT || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Validate client configuration and secret coverage
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo 'Missing VITE_SUPABASE_URL'; exit 1; }
          test -n "${SUPABASE_ANON_KEY:-}" || { echo 'Missing VITE_SUPABASE_ANON_KEY'; exit 1; }
          echo 'Client configuration present.'
          for name in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF OPENROUTER_API_KEY; do
            if [ -n "${!name:-}" ]; then echo "SECRET $name=PRESENT"; else echo "SECRET $name=MISSING"; fi
          done

      - name: Probe Supabase Auth
        shell: bash
        run: |
          set -euo pipefail
          origin="${SUPABASE_URL%/}"
          auth_status=$(curl --silent --show-error --output "$RUNNER_TEMP/auth.json" --write-out '%{http_code}' \
            --location --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$origin/auth/v1/settings")
          echo "AUTH_HTTP=$auth_status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              value = json.loads(Path(os.environ['RUNNER_TEMP'], 'auth.json').read_text())
          except Exception:
              value = {}
          print('AUTH_SETTINGS_JSON=' + ('ok' if isinstance(value, dict) and value else 'invalid'))
          PY

      - name: Probe known tables without reading private rows
        shell: bash
        run: |
          set -euo pipefail
          origin="${SUPABASE_URL%/}"
          for table in admin_users support_users pairing_codes devices tickets diagnostics sessions releases device_entitlements device_consents; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/$table.json" --write-out '%{http_code}' \
              --location --connect-timeout 10 --max-time 30 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$origin/rest/v1/$table?select=*&limit=0")
            code=$(python - "$RUNNER_TEMP/$table.json" <<'PY'
          import json, sys
          try:
              value=json.load(open(sys.argv[1]))
              print(value.get('code','') if isinstance(value,dict) else '')
          except Exception:
              print('')
          PY
          )
            echo "TABLE_HTTP $table=$status${code:+ code=$code}"
          done

      - name: Count rows with service role when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo 'SERVICE_ROLE_COUNTS=SKIPPED'
            exit 0
          fi
          origin="${SUPABASE_URL%/}"
          for table in admin_users support_users pairing_codes devices tickets diagnostics sessions releases device_entitlements device_consents; do
            headers="$RUNNER_TEMP/$table.headers"
            status=$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' \
              --location --connect-timeout 10 --max-time 30 \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Prefer: count=exact' \
              -H 'Range: 0-0' \
              "$origin/rest/v1/$table?select=*")
            count=$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r",""); split($2,a,"/"); print a[2]}' "$headers" | tail -n 1)
            echo "ROW_COUNT $table status=$status count=${count:-unknown}"
          done

          auth_admin_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --location --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$origin/auth/v1/admin/users?page=1&per_page=1")
          echo "AUTH_ADMIN_HTTP=$auth_admin_status"

      - name: Read public release metadata
        shell: bash
        run: |
          set -euo pipefail
          origin="${SUPABASE_URL%/}"
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/releases.json" --write-out '%{http_code}' \
            --location --connect-timeout 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$origin/rest/v1/releases?select=version,published_at,is_active&order=published_at.desc&limit=3")
          echo "RELEASES_HTTP=$status"
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              value=json.loads(Path(os.environ['RUNNER_TEMP'],'releases.json').read_text())
          except Exception:
              value=[]
          print('PUBLIC_RELEASE_ROWS=' + str(len(value) if isinstance(value,list) else 0))
          if isinstance(value,list):
              for row in value:
                  print('RELEASE ' + str({k: row.get(k) for k in ('version','published_at','is_active')}))
          PY

      - name: Probe assistant edge function
        shell: bash
        run: |
          set -euo pipefail
          origin="${SUPABASE_URL%/}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --location --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$origin/functions/v1/nexo-assistant")
          echo "ASSISTANT_FUNCTION_HTTP=$status"
