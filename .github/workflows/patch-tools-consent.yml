name: Finalize tools consent

on:
  push:
    branches: [feat/secure-ai-support-agent]
    paths:
      - '.github/workflows/patch-tools-consent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/secure-ai-support-agent
      - name: Patch tools consent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/SupportAppV6.tsx')
          text = path.read_text(encoding='utf-8')
          old = "const toolsConsent: UpdateConsentInput = {\n  assistantEnabled: true,\n  shareDiagnostics: false,"
          new = "const toolsConsent: UpdateConsentInput = {\n  assistantEnabled: false,\n  shareDiagnostics: false,"
          if old not in text:
              raise SystemExit('toolsConsent block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-tools-consent.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/SupportAppV6.tsx .github/workflows/patch-tools-consent.yml
          git commit -m "fix: keep tools-only mode assistant-disabled"
          git push origin HEAD:feat/secure-ai-support-agent
