name: Apply NEXO contract fix

on:
  push:
    branches: [main]
    paths:
      - .github/nexo-contracts.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update product contracts
        run: python .github/scripts/update_nexo_contracts.py
      - name: Validate frontend and contracts
        run: |
          npm ci
          npm run build
          node scripts/verify-product-contracts.mjs
      - name: Commit contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-product-contracts.mjs
          git commit -m "Update contracts for safer admin and RustDesk flow"
          git push
