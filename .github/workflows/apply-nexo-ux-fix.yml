name: Apply NEXO admin backend fallback

on:
  push:
    branches: [main]
    paths:
      - .github/nexo-admin-fallback.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fallback patch
        run: python .github/scripts/apply_admin_backend_fallback.py
      - name: Validate frontend and contracts
        run: |
          npm ci
          npm run build
          node scripts/verify-product-contracts.mjs
      - name: Commit fallback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AdminApp.tsx src/lib/backend.ts scripts/verify-product-contracts.mjs
          git commit -m "Keep NEXO Control usable with incomplete backend"
          git push
