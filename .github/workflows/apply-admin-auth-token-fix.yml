name: Apply admin auth token fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-auth-token-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-auth-token-camelcase
          fetch-depth: 0

      - name: Fix camelized Supabase auth response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/backend.ts')
          text = path.read_text(encoding='utf-8')

          access_count = text.count('a.access_token')
          refresh_count = text.count('a.refresh_token')
          if access_count != 2:
              raise SystemExit(f'Expected 2 a.access_token references, found {access_count}')
          if refresh_count != 1:
              raise SystemExit(f'Expected 1 a.refresh_token reference, found {refresh_count}')

          text = text.replace('a.access_token', 'a.accessToken')
          text = text.replace('a.refresh_token', 'a.refreshToken')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/backend.ts
          git commit -m "fix: preserve authenticated Supabase admin token"
          git push origin HEAD:fix/admin-auth-token-camelcase

      - name: Record patch result
        if: always()
        uses: actions/github-script@v7
        env:
          PATCH_STATUS: ${{ job.status }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.admin-token-fix-result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const payload = {
              status: process.env.PATCH_STATUS,
              runId: String(context.runId),
              sourceCommit: context.sha,
              checkedAt: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: `admin-token-fix: ${payload.status}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
