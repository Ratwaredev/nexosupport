name: Apply manual updater and reset fix

on:
  push:
    branches: [fix/manual-updates-and-password-reset]
    paths:
      - 'tools/apply_manual_update_reset_fix.py'
      - '.github/workflows/apply-manual-update-reset-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-updates-and-password-reset
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_manual_update_reset_fix.py

      - name: Remove one-shot patch files
        run: |
          rm -f tools/apply_manual_update_reset_fix.py
          rm -f .github/workflows/apply-manual-update-reset-fix.yml

      - name: Commit patched product
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make updates manual and repair password recovery"
          git push origin HEAD:fix/manual-updates-and-password-reset
