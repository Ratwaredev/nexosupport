name: Publish clean Forge Studio v0.26 installer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct Forge Studio runtime
        shell: pwsh
        run: |
          $parts = Get-ChildItem "forge-build/payload/part-*" | Sort-Object Name
          if ($parts.Count -ne 16) { throw "Expected 16 payload files, found $($parts.Count)" }
          $payload = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("forge-runtime.tar.xz", [Convert]::FromBase64String($payload))
          New-Item -ItemType Directory -Force -Path forge-app | Out-Null
          tar -xJf forge-runtime.tar.xz -C forge-app
          $version = node -p "require('./forge-app/package.json').version"
          if ($version -ne "0.26.0") { throw "Expected Forge Studio 0.26.0, got $version" }
          Set-Content "forge-app/README.md" "# Forge Studio"
          New-Item -ItemType Directory -Force -Path "forge-app/docs" | Out-Null
          Set-Content "forge-app/docs/README.md" "# Forge Studio"

      - name: Install desktop dependencies
        working-directory: forge-app
        run: npm install --no-audit --no-fund

      - name: Validate packaged runtime
        working-directory: forge-app
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check dist/server/index.js
          node --check dist/agent/index.js

      - name: Build standard NSIS installer and portable app
        working-directory: forge-app
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem "forge-app/release/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "forge-app/release/SHA256SUMS.txt"
          }

      - name: Publish temporary clean build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "forge-v0.26.0-clean-11" `
            forge-app/release/*.exe `
            forge-app/release/*.blockmap `
            forge-app/release/latest*.yml `
            forge-app/release/SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --target "${{ github.event.pull_request.head.sha }}" `
            --title "Forge Studio v0.26.0 clean Windows build" `
            --notes "Temporary standard Electron Builder/NSIS build. No custom bootstrap or PowerShell installer." `
            --prerelease
