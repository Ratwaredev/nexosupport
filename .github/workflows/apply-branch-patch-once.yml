name: Apply updater and reset patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-branch-patch-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-updates-and-password-reset
          fetch-depth: 0

      - name: Apply product patch
        run: python tools/apply_manual_update_reset_fix.py

      - name: Commit target branch
        run: |
          rm -f tools/apply_manual_update_reset_fix.py
          rm -f .github/workflows/apply-manual-update-reset-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make updates manual and repair password recovery"
          git push origin HEAD:fix/manual-updates-and-password-reset

      - name: Remove this one-shot workflow from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/apply-branch-patch-once.yml
          git commit -m "Remove one-shot patch workflow"
          git push origin main

# second commit intentionally triggers the already-registered workflow
