name: Validate Windows app

on:
  pull_request:
  push:
    branches: [main, agent/nexo-support-rebrand]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build native sensor reader
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1
      - name: Verify and execute sensor reader before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'src-tauri\resources\sensor-helper'
          $reader = Join-Path $root 'Nexo.SensorReader.exe'
          $library = Join-Path $root 'LibreHardwareMonitorLib.dll'
          if (-not (Test-Path $reader)) { throw 'Missing Nexo.SensorReader.exe before build.' }
          if (-not (Test-Path $library)) { throw 'Missing LibreHardwareMonitorLib.dll before build.' }
          $files = @(Get-ChildItem $root -File)
          $bytes = ($files | Measure-Object Length -Sum).Sum
          if ($files.Count -lt 10 -or $bytes -lt 10000000) { throw "Sensor helper is incomplete: $($files.Count) files, $bytes bytes." }
          $probePath = Join-Path $env:RUNNER_TEMP 'sensor-source-probe.json'
          $process = Start-Process -FilePath $reader -ArgumentList @('--output', $probePath) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Sensor reader exited with code $($process.ExitCode)." }
          $probe = Get-Content $probePath -Raw | ConvertFrom-Json
          if ($probe.source -ne 'native-helper') { throw "Unexpected sensor source: $($probe.source)" }
          if ($null -eq $probe.sensors) { throw 'Sensor reader did not return a sensors array.' }
          Write-Host "Sensor reader executed successfully with $(@($probe.sensors).Count) readings."
      - name: Validate frontend
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object -FilePath frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify product contracts
        run: node scripts/verify-product-contracts.mjs
      - name: Upload frontend diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-frontend-log
          path: frontend.log
          if-no-files-found: ignore
      - name: Install browser for click smoke
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Exercise compact popup actions and admin entry
        shell: pwsh
        run: |
          $preview = Start-Process npm.cmd -ArgumentList @('run','preview','--','--host','127.0.0.1','--port','4173') -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start.' }
            node scripts/smoke-ui.mjs *>&1 | Tee-Object -FilePath ui-smoke.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload UI smoke diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ui-smoke-log
          path: ui-smoke.log
          if-no-files-found: ignore
      - name: Validate Tauri backend
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml *>&1 | Tee-Object -FilePath cargo.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Rust diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-rust-log
          path: cargo.log
          if-no-files-found: ignore
      - name: Build unsigned Windows installer
        run: npm run tauri:build -- --config src-tauri/tauri.ci.conf.json
      - name: Install bundle and execute packaged sensor reader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }

          $requestedRoot = Join-Path $env:RUNNER_TEMP 'nexo-package-check'
          Remove-Item $requestedRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$requestedRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installer failed with code $($process.ExitCode)." }

          $candidateRoots = @(
            $requestedRoot,
            (Join-Path $env:LOCALAPPDATA 'NEXO Support'),
            (Join-Path $env:LOCALAPPDATA 'Programs\NEXO Support'),
            (Join-Path $env:ProgramFiles 'NEXO Support')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          $reader = $null
          for ($attempt = 1; $attempt -le 20 -and -not $reader; $attempt++) {
            foreach ($root in $candidateRoots) {
              $reader = Get-ChildItem $root -Recurse -Filter 'Nexo.SensorReader.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($reader) { break }
            }
            if (-not $reader) { Start-Sleep -Seconds 1 }
          }

          $tree = foreach ($root in $candidateRoots) {
            "ROOT: $root"
            Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          }
          $tree | Set-Content -Path installed-package-tree.log -Encoding utf8
          $tree | Select-Object -First 250 | ForEach-Object { Write-Host $_ }

          if (-not $reader) { throw 'Installed app does not contain Nexo.SensorReader.exe.' }
          $readerDirectory = $reader.Directory.FullName
          if (-not (Test-Path (Join-Path $readerDirectory 'LibreHardwareMonitorLib.dll'))) { throw "Installed helper is missing LibreHardwareMonitorLib.dll: $readerDirectory" }
          $probePath = Join-Path $env:RUNNER_TEMP 'sensor-installed-probe.json'
          $readerProcess = Start-Process -FilePath $reader.FullName -ArgumentList @('--output', $probePath) -Wait -PassThru -NoNewWindow
          if ($readerProcess.ExitCode -ne 0) { throw "Installed sensor reader exited with code $($readerProcess.ExitCode)." }
          $probe = Get-Content $probePath -Raw | ConvertFrom-Json
          if ($probe.source -ne 'native-helper') { throw "Installed helper returned unexpected source: $($probe.source)" }
          Write-Host "Installed sensor reader verified at $readerDirectory with $(@($probe.sensors).Count) readings."

          foreach ($root in $candidateRoots) {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload installed package diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-installed-package-tree
          path: installed-package-tree.log
          if-no-files-found: ignore
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexo-support-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
