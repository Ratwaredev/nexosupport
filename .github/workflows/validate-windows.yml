name: Validate Windows app

on:
  pull_request:
  push:
    branches: [main, agent/nexo-support-rebrand]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Prepare hardware sensor library
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1
      - name: Validate frontend
        run: npm run build
      - name: Validate Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned Windows installer
        run: npm run tauri:build -- --config src-tauri/tauri.ci.conf.json
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexo-support-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
