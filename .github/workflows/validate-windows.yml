name: Validate Windows app

on:
  pull_request:
  push:
    branches: [main, agent/nexo-support-rebrand]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Prepare hardware sensor library
        shell: pwsh
        run: ./scripts/prepare-sensors.ps1
      - name: Verify sensor source bundle
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'src-tauri\resources\sensors'
          $required = @('LibreHardwareMonitorLib.dll', 'HidSharp.dll')
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path $path)) { throw "Missing sensor dependency before build: $name" }
          }
          $dlls = @(Get-ChildItem $root -Filter '*.dll' -File)
          if ($dlls.Count -lt 4) { throw "Sensor bundle is incomplete: only $($dlls.Count) DLLs." }
          Write-Host "Sensor source bundle verified: $($dlls.Count) DLLs."
      - name: Validate frontend
        shell: pwsh
        run: |
          npm run build *>&1 | Tee-Object -FilePath frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload frontend diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-frontend-log
          path: frontend.log
          if-no-files-found: ignore
      - name: Install browser for click smoke
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Exercise popup actions and admin entry
        shell: pwsh
        run: |
          $preview = Start-Process npm.cmd -ArgumentList @('run','preview','--','--host','127.0.0.1','--port','4173') -PassThru
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Vite preview did not start.' }
            node scripts/smoke-ui.mjs *>&1 | Tee-Object -FilePath ui-smoke.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload UI smoke diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ui-smoke-log
          path: ui-smoke.log
          if-no-files-found: ignore
      - name: Validate Tauri backend
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml *>&1 | Tee-Object -FilePath cargo.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Rust diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-rust-log
          path: cargo.log
          if-no-files-found: ignore
      - name: Build unsigned Windows installer
        run: npm run tauri:build -- --config src-tauri/tauri.ci.conf.json
      - name: Install bundle and verify packaged sensors
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'nexo-package-check'
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          & $installer.FullName /S "/D=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with code $LASTEXITCODE." }
          $mainDll = Get-ChildItem $installRoot -Recurse -Filter 'LibreHardwareMonitorLib.dll' -File | Select-Object -First 1
          $hidDll = Get-ChildItem $installRoot -Recurse -Filter 'HidSharp.dll' -File | Select-Object -First 1
          if (-not $mainDll) { throw 'Installed app does not contain LibreHardwareMonitorLib.dll.' }
          if (-not $hidDll) { throw 'Installed app does not contain HidSharp.dll.' }
          $sensorDirectory = $mainDll.Directory.FullName
          $dllCount = @(Get-ChildItem $sensorDirectory -Filter '*.dll' -File).Count
          if ($dllCount -lt 4) { throw "Installed sensor directory is incomplete: $dllCount DLLs." }
          Write-Host "Installed sensor bundle verified at $sensorDirectory with $dllCount DLLs."
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: nexo-support-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
