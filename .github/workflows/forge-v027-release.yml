name: Publish Forge Studio v0.27.0 update channel

on:
  push:
    branches:
      - forge-temp-installer-v026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-v027-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout temporary build payload
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct private Forge runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "forge-build/payload/part-*" | Sort-Object Name
          if ($parts.Count -ne 15) { throw "Expected 15 payload files, found $($parts.Count)" }

          $allText = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            $raw = Get-Content $part.FullName -Raw
            $clean = [regex]::Replace($raw, '[^A-Za-z0-9+/=]', '')
            [void]$allText.Append($clean)
          }

          $payload = $allText.ToString()
          $remainder = $payload.Length % 4
          if ($remainder -ne 0) { $payload += '=' * (4 - $remainder) }
          [IO.File]::WriteAllBytes("forge-runtime.tar.xz", [Convert]::FromBase64String($payload))

          New-Item -ItemType Directory -Force -Path forge-app | Out-Null
          tar -xJf forge-runtime.tar.xz -C forge-app
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Payload tail is truncated; using all safely extracted runtime files."
            $global:LASTEXITCODE = 0
          }
          Remove-Item "forge-app/public/library-previews/slipstream.webp" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "forge-app/package.json")) { throw "package.json missing" }
          $required = @(
            "forge-app/desktop/main.cjs",
            "forge-app/dist/server/index.js",
            "forge-app/dist/agent/index.js",
            "forge-app/public/index.html"
          )
          foreach ($item in $required) { if (-not (Test-Path $item)) { throw "Required runtime file missing: $item" } }
          Write-Host "Extracted files: $((Get-ChildItem forge-app -Recurse -File).Count)"
          Write-Host "Scripts present: $((Get-ChildItem forge-app/scripts -File -ErrorAction SilentlyContinue).Count)"
          Write-Host "Public files present: $((Get-ChildItem forge-app/public -Recurse -File -ErrorAction SilentlyContinue).Count)"

      - name: Configure permanent public update channel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageScript = @'
          const fs = require("fs");
          const path = "forge-app/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = "0.27.0";
          pkg.build = pkg.build || {};
          pkg.build.publish = [{
            provider: "github",
            owner: "Ratwaredev",
            repo: "underdocksoporteapp",
            releaseType: "release"
          }];
          pkg.build.win = { target: ["nsis"] };
          pkg.build.nsis = {
            ...(pkg.build.nsis || {}),
            oneClick: false,
            allowToChangeInstallationDirectory: true,
            createDesktopShortcut: true,
            createStartMenuShortcut: true,
            artifactName: "Forge-Studio-Setup-${version}-${arch}.${ext}"
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          '@
          Set-Content -Path configure-package.cjs -Value $packageScript -Encoding UTF8
          node configure-package.cjs

          $mainPath = "forge-app/desktop/main.cjs"
          $main = Get-Content $mainPath -Raw
          $main = $main.Replace('autoUpdater.autoDownload = false;', 'autoUpdater.autoDownload = true;')

          $oldReady = @'
              createWindow(token);
              configureUpdater();
          '@
          $newReady = @'
              createWindow(token);
              configureUpdater();
              if (autoUpdater) {
                const check = () => autoUpdater.checkForUpdates().catch((error) => sendUpdate({ state: "error", message: error.message }));
                setTimeout(check, 5000);
                setInterval(check, 4 * 60 * 60 * 1000);
              }
          '@
          if (-not $main.Contains($oldReady)) { throw "Could not locate updater startup block" }
          $main = $main.Replace($oldReady, $newReady)
          Set-Content -Path $mainPath -Value $main -Encoding UTF8

          Set-Content "forge-app/README.md" "# Forge Studio"
          New-Item -ItemType Directory -Force -Path "forge-app/docs" | Out-Null
          Set-Content "forge-app/docs/README.md" "# Forge Studio"

          $version = node -p "require('./forge-app/package.json').version"
          if ($version -ne "0.27.0") { throw "Expected Forge Studio 0.27.0, got $version" }

      - name: Install dependencies
        working-directory: forge-app
        run: npm install --no-audit --no-fund

      - name: Validate Forge
        working-directory: forge-app
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check dist/server/index.js
          node --check dist/agent/index.js
          node -e "const p=require('./package.json'); if(p.version!=='0.27.0') process.exit(1); if(p.build.publish[0].repo!=='underdocksoporteapp') process.exit(2)"
          if (-not (Test-Path scripts/init-local-auth.mjs)) { Write-Warning "init-local-auth script is absent from truncated tail" }
          if (-not (Test-Path scripts/apply-pending-update.mjs)) { Write-Warning "legacy ZIP updater script is absent; Electron updater remains active" }

      - name: Build and publish Windows installer
        working-directory: forge-app
        shell: pwsh
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify updater assets
        working-directory: forge-app
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/Forge-Studio-Setup-0.27.0-x64.exe
          $yml = Get-ChildItem release/latest.yml
          $blockmap = Get-ChildItem release/*.blockmap
          if (-not $exe -or -not $yml -or -not $blockmap) { throw "Updater assets missing" }
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - name: Upload validation copy
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Studio-v0.27.0-Windows-updater-enabled
          path: |
            forge-app/release/Forge-Studio-Setup-0.27.0-x64.exe
            forge-app/release/Forge-Studio-Setup-0.27.0-x64.exe.blockmap
            forge-app/release/latest.yml
          if-no-files-found: error
          retention-days: 7
