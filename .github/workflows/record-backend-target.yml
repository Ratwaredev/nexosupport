name: Record NEXO backend target

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-backend-target.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Record safe backend identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'release-status';
            const path = '.backend-target.json';

            const rawUrl = (process.env.VITE_SUPABASE_URL || '').trim();
            const rawKey = (process.env.VITE_SUPABASE_ANON_KEY || '').trim();

            let hostname = null;
            let urlProjectRef = null;
            try {
              const parsed = new URL(rawUrl);
              hostname = parsed.hostname;
              const suffix = '.supabase.co';
              if (hostname.endsWith(suffix)) {
                urlProjectRef = hostname.slice(0, -suffix.length);
              }
            } catch {}

            let keyProjectRef = null;
            let keyRole = null;
            let keyIssuer = null;
            try {
              const parts = rawKey.split('.');
              if (parts.length >= 2) {
                const normalized = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
                const payload = JSON.parse(Buffer.from(padded, 'base64').toString('utf8'));
                keyProjectRef = payload.ref || null;
                keyRole = payload.role || null;
                keyIssuer = payload.iss || null;
              }
            } catch {}

            const payload = {
              urlConfigured: Boolean(rawUrl),
              keyConfigured: Boolean(rawKey),
              hostname,
              urlProjectRef,
              keyProjectRef,
              keyRole,
              keyIssuer,
              refsMatch: Boolean(urlProjectRef && keyProjectRef && urlProjectRef === keyProjectRef),
              sourceCommit: context.sha,
              runId: String(context.runId),
              checkedAt: new Date().toISOString()
            };

            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha,
              message: 'diagnostic: record NEXO backend target',
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64')
            });
